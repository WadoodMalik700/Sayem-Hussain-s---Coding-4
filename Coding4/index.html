<!DOCTYPE html>
<html>
<head>
  <title>Wellbeing Login</title>

</head>
<body>

<div class="container">

<div class="bg-shape-top"></div>
<div class="bg-shape-bottom"></div>

<div class="header">

  <div>
    <span class="logo">☀</span>
    <span class="logo-text">wellbeing</span>
  </div>

  <div class="subtitle">

  </div>

</div>

<div class="content">

<div class="card purple">
  <p>
    Supporting student wellbeing,

  </p>

</div>

<script src="app.js"></script>

</html>
